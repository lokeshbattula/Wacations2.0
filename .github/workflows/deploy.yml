# Builds the site and publishes it to the `gh-pages` branch on every push to main.
# GitHub Pages serves that branch at https://<user>.github.io/<repo>/.
# (If Pages isn't on yet: repo Settings → Pages → Source: "Deploy from a branch" → gh-pages / root.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to push the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Publish dist/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true          # keep gh-pages to a single clean commit
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
